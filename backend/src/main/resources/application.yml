spring:
  application:
    name: studysite
  config:
    # O .env da raiz do repositório usa o formato KEY=VALUE, compatível com .properties.
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/studysite}
    username: ${DB_USER:studysite}
    password: ${DB_PASSWORD:studysite}
  flyway:
    enabled: true
  session:
    jdbc:
      # As tabelas do Spring Session são criadas pela migration V1.
      initialize-schema: never
    timeout: 30d
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  compression:
    # A biblioteca tem milhares de recursos; JSON comprime muito bem.
    enabled: true
    mime-types: application/json,application/problem+json,text/plain
    min-response-size: 2KB
  error:
    include-message: always
  servlet:
    session:
      cookie:
        name: STUDYSITE_SESSION
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health

studysite:
  content-dir: ${CONTENT_DIR:../content}
  registration-enabled: ${REGISTRATION_ENABLED:true}
