services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: studysite
      POSTGRES_PASSWORD: studysite
      POSTGRES_DB: studysite
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studysite"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  db-data:
