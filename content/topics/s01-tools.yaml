# Etapa 1 — Ferramentas e execução

- id: terminal-shell
  stage: s01-tools
  title: Terminal e shell
  status: authored
  objective: Usar o shell para navegar, inspecionar e combinar programas, entendendo que cada comando é um programa que o shell encontra e executa.
  whyItMatters: Servidores, CI, containers e ferramentas de depuração são operados pelo terminal. Quem entende o que o shell faz com uma linha de comando consegue reproduzir problemas, automatizar tarefas e ler scripts de outras pessoas.
  mathThreads: [logic]
  related: [processes-streams-exit-codes, filesystem-permissions]
  explanation: |
    O terminal é só a janela que mostra texto. O **shell** (bash, zsh, fish) é um programa que lê uma linha, separa as palavras, expande coisas como `*` e `$HOME`, e então procura um executável com o nome do primeiro termo nos diretórios listados em `PATH`. Quando encontra, pede ao sistema operacional para criar um processo que execute aquele arquivo, passando as demais palavras como argumentos.

    Alguns comandos não são arquivos: `cd`, por exemplo, é um *builtin*, porque mudar o diretório atual precisa acontecer dentro do próprio shell. `type cd` e `type ls` mostram a diferença.

    A ideia central: **a linha que você digita é transformada antes de chegar ao programa**. `echo *.c` não recebe o asterisco; recebe a lista de arquivos já expandida pelo shell. Aspas mudam essa transformação. Entender isso evita boa parte dos "funciona no meu terminal mas não no script".
  misconceptions:
    - claim: O terminal e o shell são a mesma coisa.
      correction: O terminal (emulador) desenha caracteres; o shell interpreta comandos. Você pode trocar um sem trocar o outro.
    - claim: O programa recebe exatamente o texto que eu digitei.
      correction: O shell expande globs, variáveis e remove aspas antes. O programa recebe uma lista de argumentos já processada.
    - claim: Todo comando é um arquivo em /usr/bin.
      correction: Há builtins (cd, export), funções e aliases. `type nome` revela o que o shell vai executar.
  resources:
    start: missing-semester-shell
    deeper: [tlcl-cap7-seeing-the-world-as-the-shell-sees-it, bash-manual-3-5-shell-expansions, missing-semester-pt-2020-course-shell]
    videos: [ms-2026-lecture-1-shell-video-what-is-the-shell, akitando-54-ubuntu-devs-video-linux-conceitos-comandos-basicos]
  exercise:
    id: ex-shell-expansion
    title: O que o programa realmente recebe?
    prediction: Antes de rodar, escreva quantos argumentos você acha que `printf '[%s]\n' *.txt "a b" $HOME` vai imprimir numa pasta com três arquivos .txt.
    steps:
      - Crie uma pasta de testes com `mkdir -p ~/lab/shell && cd ~/lab/shell` e três arquivos com `touch a.txt b.txt c.txt`.
      - Rode `printf '[%s]\n' *.txt "a b" $HOME` e compare com sua previsão.
      - Repita com `'*.txt'` entre aspas simples e com `"$HOME"` entre aspas duplas. Anote a diferença.
      - Use `type printf`, `type cd` e `which printf` e explique por que as respostas diferem.
      - Descubra em qual diretório do `PATH` o `ls` foi encontrado.
    checks:
      - Você explica, sem consultar, quem expandiu o `*` e quando.
      - Você distingue builtin de executável com um exemplo.
  experiment:
    title: Mudar o PATH e quebrar o shell de propósito
    steps:
      - Num shell novo, rode `PATH=/nada ls` e observe a mensagem de erro.
      - Crie um script `~/lab/shell/bin/ls` que imprime "falso ls", torne-o executável e rode `PATH=~/lab/shell/bin:$PATH ls`.
      - Remova o script e explique o que o shell fez em cada caso.
    observe:
      - A mensagem de "command not found" e o exit code (`echo $?`).
      - Qual `ls` foi executado e por quê.
  reflectionQuestions:
    - Por que `cd` não pode ser um programa separado?
    - O que muda entre `rm *` e `rm '*'`? Qual é perigoso numa pasta errada?
    - Como você descobriria qual versão de um programa está sendo executada?
  completionCriteria:
    - Prevê corretamente o resultado de expansões com e sem aspas em três exemplos.
    - Explica como o shell encontra um executável usando PATH.
    - Mostra um registro do experimento do PATH com comandos e saídas.
  evidencePrompts:
    - Cole os comandos do exercício com as saídas reais e marque onde sua previsão errou.
    - Explique em 3–5 frases o caminho de uma linha de comando até virar processo.
  firstAction: Abra um terminal, rode `echo $PATH | tr ':' '\n'` e escreva quantos diretórios aparecem.
  kit:
    - term: "type comando"
      use: "Descobrir se o comando é builtin, alias, função ou arquivo, e qual o shell vai executar."
    - term: "echo $PATH"
      use: "Ver em quais diretórios, e em que ordem, o shell procura executáveis."
    - term: "\"$var\" vs '$var'"
      use: "Usar aspas duplas para expandir a variável sem quebrá-la em palavras; simples para texto literal."
    - term: "echo rm *.log"
      use: "Ver a lista que o glob vai gerar antes de rodar um comando destrutivo."
    - term: "man cmd / cmd --help"
      use: "Ler a ajuda local de um comando antes de pesquisar na internet."
    - term: "Tab, Ctrl+R, cd -"
      use: "Completar nomes, buscar no histórico e voltar ao diretório anterior sem redigitar."
  deepDive:
    - title: Scripts robustos (set -euo pipefail, trap, quoting)
      why: Quando seus scripts de CI ou deploy passarem de poucas linhas e uma falha silenciosa no meio custar caro.
      resource: shellcheck
    - title: Ordem completa das expansões do bash
      why: Ao depurar scripts com brace expansion, substituição de comandos e word splitting que se comportam de forma inesperada.
      resource: bash-manual-3-5-shell-expansions
    - title: Job control, tmux e sessões remotas por SSH
      why: Quando começar a operar servidores e precisar manter processos rodando depois de fechar o terminal.
      resource: missing-semester-cli-env-terminal-multiplexers
    - title: Dotfiles, aliases e customização do ambiente
      why: Depois que o básico estiver automático e você quiser acelerar tarefas repetidas e levar o ambiente para outras máquinas.
      resource: missing-semester-cli-env-customizing-the-shell

- id: filesystem-permissions
  stage: s01-tools
  title: Sistema de arquivos e permissões
  status: authored
  objective: Navegar pela árvore de diretórios e ler e alterar permissões, explicando quem pode ler, escrever ou executar cada arquivo e por quê.
  whyItMatters: Erros de "Permission denied", segredos legíveis por qualquer usuário e scripts que não executam são problemas diários em servidores e CI. Permissões também são a primeira linha de defesa do sistema operacional.
  prerequisites: [terminal-shell]
  related: [processes-streams-exit-codes]
  mathThreads: [logic, sets]
  explanation: |
    Tudo começa em `/`. Caminhos absolutos partem da raiz; caminhos relativos partem do diretório atual (`pwd`). `.` é o diretório atual e `..` o pai.

    Cada arquivo tem um **dono**, um **grupo** e três conjuntos de permissões: para o dono (u), para o grupo (g) e para os outros (o). Cada conjunto tem leitura (r), escrita (w) e execução (x). `ls -l` mostra algo como `-rwxr-x---`.

    Em diretórios, os bits mudam de sentido: `r` permite listar nomes, `w` permite criar e apagar entradas e `x` permite *atravessar* o diretório para chegar ao que está dentro. Por isso dá para ter um arquivo legível dentro de um diretório que você não consegue abrir.

    Na forma octal, r=4, w=2, x=1: `chmod 640 segredo.txt` significa dono lê e escreve, grupo só lê, outros nada.
  misconceptions:
    - claim: Se o arquivo tem permissão de leitura, qualquer pessoa consegue lê-lo.
      correction: Também é preciso permissão de execução (x) em todos os diretórios do caminho.
    - claim: Apagar um arquivo depende da permissão do arquivo.
      correction: Apagar remove uma entrada do diretório; depende da permissão de escrita no diretório.
    - claim: chmod 777 resolve problemas de permissão.
      correction: Resolve o sintoma abrindo o arquivo para todos. Entenda qual usuário precisa de qual acesso e dê só isso.
  resources:
    start: tlcl-cap9-permissions
    deeper: [man-chmod, missing-semester-cli-env-exercises-files-and-permissions]
    videos: [learnlinuxtv-file-permissions-video, akitando-54-ubuntu-devs-video-linux-principais-diretorios]
  exercise:
    id: ex-permissions-matrix
    title: Matriz de permissões
    prediction: Preveja se você conseguirá ler `cofre/nota.txt` depois de rodar `chmod 600 cofre/nota.txt` e `chmod 600 cofre`.
    steps:
      - Crie `~/lab/perm/cofre/nota.txt` com algum texto.
      - "Para cada combinação a seguir, preveja e depois teste `cat`, `ls` e `rm`: diretório 700/600/100 e arquivo 600/400/000."
      - Monte uma tabela com previsão, resultado real e explicação.
      - Converta três permissões entre notação simbólica e octal.
    checks:
      - A tabela tem previsão, resultado e explicação para cada linha.
      - Você explica a diferença entre `x` em arquivo e em diretório.
  experiment:
    title: Proteger um arquivo de segredos
    steps:
      - Crie um arquivo `.env` falso com um "token" inventado.
      - Verifique as permissões padrão com `ls -l` e `umask`.
      - Ajuste para que só o seu usuário leia, e confirme com `stat`.
      - Descubra por que o padrão saiu daquele jeito, investigando `umask`.
    observe:
      - A saída de `stat` antes e depois.
      - O valor de `umask` e como ele explica as permissões iniciais.
  reflectionQuestions:
    - Por que um servidor web não deve rodar como root?
    - O que um bit `x` sem `r` permite num diretório?
    - Como você verificaria se um arquivo de segredos no servidor está exposto?
  completionCriteria:
    - Prevê corretamente o resultado em pelo menos 8 de 9 combinações da matriz.
    - Converte permissões entre notação simbólica e octal sem consulta.
    - Explica a função do umask com um exemplo verificado.
  evidencePrompts:
    - Tabela da matriz de permissões com previsões erradas destacadas.
    - Saída de `stat` do arquivo de segredos protegido.
  firstAction: Rode `ls -la ~` e explique a permissão de três arquivos que aparecerem.
  kit:
    - term: "ls -l"
      use: "Ler tipo, dono, grupo e permissões (-rw-r-----) de cada arquivo."
    - term: "chmod 640 arquivo (r=4, w=2, x=1)"
      use: "Ajustar permissões em octal; segredos com 600, diretórios privados com 700."
    - term: "chmod +x script.sh"
      use: "Tornar um script executável (e conferir o shebang na primeira linha)."
    - term: "stat arquivo"
      use: "Confirmar permissões, dono e datas exatas de um arquivo."
    - term: "x em todo diretório do caminho"
      use: "Explicar um Permission denied: atravessar diretório exige x; apagar exige w no diretório."
    - term: "sudo chown $USER: arquivo"
      use: "Devolver ao seu usuário arquivos que foram criados como root no projeto."
    - term: "umask"
      use: "Ver por que arquivos novos nascem com aquelas permissões padrão."
  deepDive:
    - title: setuid, setgid e sticky bit
      why: Ao entender por que `passwd` altera arquivos do root ou por que todos escrevem em `/tmp` sem apagar arquivos alheios.
      resource: man-chmod-setuid-setgid-bits
    - title: ACLs POSIX (getfacl/setfacl)
      why: Quando o trio dono/grupo/outros não basta, por exemplo para dar acesso de leitura a um único usuário de serviço.
      resource: man-setfacl
    - title: Inodes, hard links e symlinks
      why: Ao estudar sistemas de arquivos ou investigar disco cheio com arquivos apagados que ainda ocupam espaço.
      resource: ostep-files-directories
    - title: Capabilities e user namespaces
      why: Quando for rodar serviços e containers com o mínimo de privilégio, sem dar root inteiro ao processo.
      resource: man-capabilities

- id: processes-streams-exit-codes
  stage: s01-tools
  title: Processos, stdin/stdout/stderr e exit codes
  status: authored
  objective: Explicar que todo programa em execução é um processo com três fluxos padrão e um código de saída, e combinar programas com pipes e redirecionamentos.
  whyItMatters: Scripts de CI, healthchecks e pipelines de dados decidem se algo "deu certo" pelo exit code. Logs perdidos quase sempre são stderr indo para outro lugar. Isso aparece de novo em sistemas operacionais, no mini shell e em containers.
  prerequisites: [terminal-shell]
  related: [filesystem-permissions, git-fundamentals]
  mathThreads: [logic]
  explanation: |
    Quando o shell executa um programa, cria um **processo**: um programa em execução, com um identificador (PID), memória própria e uma tabela de arquivos abertos. Por convenção, três entradas dessa tabela já vêm abertas: **0 = stdin**, **1 = stdout** e **2 = stderr**.

    `>` redireciona o descritor 1 para um arquivo; `2>` redireciona o 2; `<` faz o 0 ler de um arquivo. Um pipe `a | b` liga o stdout de `a` ao stdin de `b` — os dois rodam **ao mesmo tempo**.

    Ao terminar, o processo devolve um número de 0 a 255, o **exit code**. Zero significa sucesso; qualquer outro valor significa falha, e o significado exato depende do programa. O shell guarda o último em `$?`. `&&` só executa o próximo comando se o anterior saiu com 0; `||` só se falhou.

    Separar stdout (dados) de stderr (diagnóstico) permite que `programa | outro` passe só os dados adiante enquanto as mensagens de erro continuam visíveis.
  misconceptions:
    - claim: Mensagens de erro saem no mesmo lugar que a saída normal.
      correction: Saem no stderr (descritor 2). `cmd > out.txt` ainda mostra erros na tela.
    - claim: Num pipe, o primeiro comando termina antes de o segundo começar.
      correction: Os dois rodam em paralelo; os dados fluem conforme são produzidos.
    - claim: Se o programa imprimiu "erro", ele falhou.
      correction: Quem decide é o exit code. Há programas que imprimem erros e saem com 0, o que confunde scripts.
  resources:
    start: bash-manual-3-6-redirections
    deeper: [bash-manual-3-2-3-pipelines, bash-manual-3-7-5-exit-status, man-pipe, man-exit, beej-c-outside-env, missing-semester-cli-env-command-line-interface]
    videos: [ms-2026-lecture-2-cli-env-video-streams, sorber-stderr-video]
  exercise:
    id: ex-streams-exit
    title: Para onde foi a saída?
    prediction: Escreva o que vai aparecer na tela e em cada arquivo ao rodar `ls /etc /nao-existe > out.txt 2> err.txt; echo $?`.
    steps:
      - Rode o comando da previsão e inspecione `out.txt`, `err.txt` e o número impresso.
      - Rode `ls /nao-existe 2>&1 | wc -l` e `ls /nao-existe | wc -l`. Explique a diferença.
      - Teste `true && echo sim`, `false && echo sim` e `false || echo plano-b`.
      - Escreva um script `checa.sh` que sai com 0 se um arquivo existe e com 3 se não existe; verifique com `$?`.
    checks:
      - Você explica a ordem de `2>&1` em relação a `>`.
      - Seu script devolve códigos diferentes e você mostra isso com `echo $?`.
  experiment:
    title: Observar um pipe vivo
    steps:
      - Rode `yes | head -n 3` e explique por que termina, mesmo `yes` sendo infinito.
      - Em outro terminal, rode `sleep 100 | cat` e use `ps -o pid,ppid,stat,cmd --forest` para ver os dois processos.
      - Mate o `sleep` com `kill` e observe o que acontece com o `cat`.
    observe:
      - PIDs e o processo pai (PPID) de cada lado do pipe.
      - O exit code reportado pelo shell depois do kill.
  reflectionQuestions:
    - Por que um pipeline de CI pode "passar" mesmo com um comando falhando no meio? (Pesquise `set -o pipefail`.)
    - Qual a vantagem de separar dados e diagnósticos em fluxos diferentes?
    - O que significa um exit code 130 depois de Ctrl+C?
  completionCriteria:
    - Prevê corretamente o destino de stdout e stderr em quatro redirecionamentos diferentes.
    - Escreve um script com exit codes significativos e demonstra o comportamento com && e ||.
    - Mostra a árvore de processos de um pipeline e explica a relação pai/filho.
  evidencePrompts:
    - Script checa.sh (link ou texto) e saídas de `echo $?` nos dois casos.
    - Saída do `ps --forest` com uma explicação de cada linha.
  firstAction: Rode `ls /nao-existe; echo $?` e anote o número que aparece.
  kit:
    - term: "cmd > out.txt 2> err.txt"
      use: "Separar dados (stdout, fd 1) de erros (stderr, fd 2) em arquivos diferentes."
    - term: "cmd > tudo.log 2>&1"
      use: "Juntar stdout e stderr no mesmo arquivo (o 2>&1 vem depois do >)."
    - term: "a | b"
      use: "Ligar o stdout de um programa ao stdin de outro; os dois rodam ao mesmo tempo."
    - term: "echo $?"
      use: "Ver o exit code do último comando: 0 é sucesso, qualquer outro valor é falha."
    - term: "cmd && deu_certo || falhou"
      use: "Encadear comandos conforme o exit code do anterior."
    - term: "echo \"erro\" >&2; exit 1"
      use: "Fazer seus scripts reportarem falha de um jeito que outros programas e o CI entendem."
    - term: "ps -o pid,ppid,stat,cmd --forest / kill PID"
      use: "Ver a árvore de processos (pai e filhos) e encerrar um processo pelo PID."
  deepDive:
    - title: fork, exec e wait
      why: Quando for implementar o mini shell ou entender como servidores e o próprio shell criam processos.
      resource: ostep-process-api
    - title: dup2 e a tabela de descritores de arquivo
      why: Ao implementar redirecionamentos e pipes em C ou depurar descritores vazando em servidores.
      resource: man-dup
    - title: Sinais e trap
      why: Quando precisar de desligamento gracioso (SIGTERM em containers) ou limpar arquivos temporários ao interromper um script.
      resource: sorber-signals-in-c
    - title: Buffering de stdio
      why: Ao estranhar saída fora de ordem ou que só aparece no fim quando o programa escreve num pipe em vez do terminal.
      resource: man-setvbuf
    - title: Inspecionar processos pelo /proc
      why: Ao depurar em produção quais arquivos, variáveis de ambiente e limites um processo realmente tem.
      resource: man-proc

- id: git-fundamentals
  stage: s01-tools
  title: Fundamentos de Git
  status: authored
  objective: Usar Git para registrar, inspecionar e desfazer mudanças, explicando o modelo de commits, branches e working tree.
  whyItMatters: Todo trabalho do time — inclusive as evidências deste site — passa por repositórios. Entender o modelo do Git evita perder trabalho, facilita revisões e permite investigar quando um bug apareceu.
  prerequisites: [terminal-shell]
  related: [processes-streams-exit-codes]
  mathThreads: [graphs]
  explanation: |
    Git guarda **snapshots**, não diferenças. Cada commit aponta para uma árvore de arquivos completa e para seu(s) commit(s) pai(s), formando um grafo dirigido acíclico. Um **branch** é só um nome que aponta para um commit; `HEAD` indica onde você está.

    Há três lugares que importam: o **working tree** (arquivos no disco), a **staging area/index** (o que vai entrar no próximo commit) e o **repositório** (commits já gravados). `git status` mostra a diferença entre os três; `git add` copia do working tree para o index; `git commit` grava o index como um novo snapshot.

    Como commits são imutáveis e identificados por hash, "desfazer" quase sempre significa criar um commit novo (`git revert`) ou mover um nome para outro commit (`git reset`, `git switch`). `git reflog` lembra por onde o HEAD passou, o que torna raro perder algo que já foi commitado.
  misconceptions:
    - claim: Um branch é uma cópia dos arquivos.
      correction: É um ponteiro leve para um commit. Criar um branch não copia nada.
    - claim: git add salva meu trabalho.
      correction: Só coloca na staging area. Até o commit, a mudança não está no histórico.
    - claim: Depois de um reset, o commit sumiu para sempre.
      correction: Ele continua acessível pelo reflog por um bom tempo, até a coleta de lixo.
  resources:
    start: pro-git-ptbr-cap2-fundamentos-do-git
    deeper: [akita-git, missing-semester-git]
    videos: [akitando-70-entendendo-git-video, ms-2026-lecture-5-git-video, akitando-71-usando-git-direito-video]
  exercise:
    id: ex-git-graph
    title: Desenhar o grafo antes de ver
    prediction: Antes de rodar `git log --graph --oneline --all`, desenhe no papel o grafo que você espera depois dos passos abaixo.
    steps:
      - Crie um repositório em `~/lab/git`, faça três commits pequenos em `main`.
      - Crie o branch `experimento`, faça dois commits nele, volte para `main` e faça mais um.
      - Faça merge de `experimento` em `main` e compare o grafo real com seu desenho.
      - Use `git show HEAD~1` e `git diff HEAD~2 HEAD` e explique o que cada um mostra.
    checks:
      - O desenho e o grafo real batem, ou você explica a diferença.
      - Você explica o que é HEAD naquele momento.
  experiment:
    title: Perder e recuperar um commit
    steps:
      - Faça um commit com uma mudança importante.
      - Rode `git reset --hard HEAD~1` e confirme que a mudança sumiu do working tree.
      - Encontre o commit com `git reflog` e recupere-o criando um branch.
      - Repita usando `git revert` em vez de reset e compare os históricos.
    observe:
      - O hash do commit antes e depois da recuperação.
      - A diferença entre o histórico com reset e com revert.
  reflectionQuestions:
    - Por que `git revert` é preferível a `reset` num branch compartilhado?
    - O que um commit pequeno e bem descrito facilita numa revisão?
    - Como você usaria o histórico para descobrir quando um bug foi introduzido? (Pesquise `git bisect`.)
  completionCriteria:
    - Desenha corretamente o grafo de commits de um cenário com branch e merge.
    - Recupera um commit "perdido" usando o reflog.
    - Explica a diferença entre working tree, index e repositório.
  evidencePrompts:
    - Foto ou texto do grafo previsto ao lado da saída de `git log --graph`.
    - Comandos usados para recuperar o commit, com os hashes.
  firstAction: Rode `git config --global --list` e confira se seu nome e e-mail estão configurados.
  kit:
    - term: "git status"
      use: "Ver o que mudou e o que está preparado antes de qualquer outro comando."
    - term: "git add <arquivo>"
      use: "Preparar as mudanças que vão entrar no próximo commit."
    - term: "git commit -m \"mensagem\""
      use: "Gravar um snapshot com uma descrição do que mudou."
    - term: "git pull"
      use: "Trazer o trabalho do time antes de começar e antes de enviar."
    - term: "git push"
      use: "Enviar seus commits para o repositório compartilhado."
  deepDive:
    - title: Branches, diff e desfazer (switch, merge, diff, log --graph, revert, reflog)
      why: Logo depois do ciclo diário, ao trabalhar em paralelo num branch, revisar o que vai entrar ou recuperar um commit perdido.
      resource: pro-git-ptbr-cap3-ramificacao
    - title: Rebase interativo e reescrita de histórico
      why: Quando for limpar commits antes de abrir um pull request ou o time adotar histórico linear.
      resource: pro-git-ptbr-reescrevendo-historico
    - title: git bisect para caçar regressões
      why: Quando um bug aparecer e você souber uma versão boa e uma ruim, mas não qual commit o introduziu.
      resource: git-docs-bisect
    - title: Internals (objetos blob, tree, commit e refs)
      why: Ao querer entender por que o Git é rápido ou recuperar situações estranhas no repositório.
