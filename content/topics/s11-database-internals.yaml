  exercise:
    id: ex-offset-vs-keyset
    title: OFFSET versus keyset medido
    prediction: Numa tabela de 1 milhão de tarefas, estime quantas linhas o banco lê para buscar a página 1, a 1000 e a 40000 (20 por página) com OFFSET e com keyset.
    steps:
      - "Crie o índice `CREATE INDEX tasks_created_id ON tasks (created_at DESC, id DESC);`."
      - "Para as páginas 1, 1000 e 40000, rode `EXPLAIN (ANALYZE, BUFFERS)` com `LIMIT 20 OFFSET n` e anote tempo, buffers e as rows do nó Index Scan."
      - Descubra o (created_at, id) da última linha da página anterior e escreva a consulta keyset equivalente para as mesmas páginas.
      - Monte uma tabela página × método com tempo e buffers e compare com sua previsão.
    checks:
      - O nó Index Scan com OFFSET mostra rows reais próximas de offset + 20; o keyset mostra cerca de 20.
      - Os resultados do keyset são idênticos aos do OFFSET para as mesmas páginas (verifique com EXCEPT).
  experiment:
    title: Páginas que escorregam e empates que somem
    project: postgres-performance-lab
    steps:
      - Busque a página 1 com OFFSET, insira 5 tarefas novas mais recentes em outro psql e busque a página 2. Procure itens repetidos.
      - Repita a navegação com keyset e confirme que não há repetição.
      - "Crie 50 tarefas com exatamente o mesmo created_at, pagine com keyset só por created_at (sem id) em páginas de 20 e conte quantas linhas aparecem no total."
      - "Escreva um teste automatizado (JUnit ou script) que percorre todas as páginas e verifica que cada id aparece exatamente uma vez."
    observe:
      - Os ids duplicados entre páginas com OFFSET após inserções concorrentes.
      - Linhas perdidas quando a ordem não tem desempate.
      - O teste falhando na versão sem desempate e passando na versão com (created_at, id).
  reflectionQuestions:
    - Por que a ordem precisa ser total para a paginação keyset ser correta?
    - Como você codificaria e validaria o cursor numa API HTTP pública?
    - Em que tela de um produto OFFSET ainda é aceitável, e por quê?
  completionCriteria:
    - Apresenta a tabela de tempos e buffers para OFFSET e keyset nas páginas 1, 1000 e 40000 medidas com EXPLAIN (ANALYZE, BUFFERS).
    - Mostra itens duplicados com OFFSET após inserções concorrentes e a ausência deles com keyset.
    - Apresenta um teste que percorre todas as páginas e detecta a perda de linhas sem desempate.
  evidencePrompts:
    - Consultas, planos e a tabela comparativa com sua previsão inicial ao lado.
    - Saída do teste de percurso completo falhando e depois passando.
  firstAction: "Rode `EXPLAIN ANALYZE SELECT * FROM generate_series(1, 1000000) g ORDER BY g LIMIT 10 OFFSET 900000;` e veja quantas linhas o nó Limit recebeu."
  essentials:
    - "Em listagens grandes ou rolagem infinita, use keyset: `WHERE (created_at, id) < ($1, $2) ORDER BY created_at DESC, id DESC LIMIT n`."
    - Garanta ordem total com uma coluna única de desempate (id) na ordenação e no cursor.
    - Crie o índice composto na mesma ordem da paginação para o banco descer direto até a posição.
    - "Exponha a última chave como cursor opaco (ex.: base64) e valide-o como qualquer entrada do cliente."
    - "Reserve OFFSET para tabelas pequenas ou quando pular para a página N for requisito; meça com `EXPLAIN (ANALYZE, BUFFERS)`."
