      resource: ostep-free-space
    - title: Array of structs vs struct of arrays
      why: Quando cada linha de cache contar (simulações, engines, processamento em lote) e o layout dos dados decidir o desempenho.
      resource: mike-acton-data-oriented-design-cppcon-2014-cache-optimization-examples
    - title: Gap buffers e ropes
      why: Quando construir um editor de texto ou estrutura com muitas inserções perto de um cursor.

- id: linked-lists
  stage: s05-algorithms-basics
  title: Listas ligadas
  status: authored
  objective: Implementar listas simples e duplamente ligadas e comparar seu desempenho real com arrays.
  whyItMatters: Mostra na prática o custo de ponteiros e de má localidade de cache. Listas intrusivas aparecem no kernel Linux e em alocadores; e saber quando NÃO usar lista é tão importante quanto implementá-la.
  prerequisites: [pointers, complexity-analysis]
  related: [dynamic-arrays, stacks-queues, cpu-memory-caches, memory-debugging]
  mathThreads: [proofs]
  explanation: |
    Uma **lista ligada** é uma sequência de nós alocados separadamente, cada um com um valor e um ponteiro para o próximo (`next`); na **duplamente ligada**, também para o anterior (`prev`). Inserir ou remover num ponto **que você já tem em mãos** custa `O(1)`: só religa ponteiros, sem deslocar nada. Mas chegar à posição `i` custa `O(i)`, porque é preciso seguir os ponteiros um a um.

    O custo escondido é a **localidade**. Num array, o próximo elemento está nos bytes seguintes — o hardware traz linhas de 64 bytes e o *prefetcher* adivinha o padrão. Numa lista, cada `p = p->next` é uma **dependência de carga**: o processador só sabe o próximo endereço depois que o atual chegou da memória. Se os nós estão espalhados pela heap, cada passo pode ser um *cache miss* de ~100 ns. Por isso percorrer uma lista de 10 milhões de nós pode ser 10–50x mais lento que um array do mesmo tamanho, apesar de ambos serem `O(n)`.

    Truques que simplificam e protegem o código:

    - **Nó sentinela** (dummy): um nó fixo antes do primeiro elimina os casos especiais de lista vazia e de inserção na cabeça.
    - **Ponteiro para ponteiro** (`node **pp`): remove sem tratar a cabeça separadamente.
    - **Listas intrusivas**: o nó fica dentro da struct do dado (como `struct list_head` no kernel), evitando uma alocação extra por elemento.

    Os bugs típicos são de memória: usar `p->next` depois de `free(p)`, perder o resto da lista ao religar na ordem errada, ou criar um ciclo sem querer. Um invariante ajuda a testar: "seguindo `next` a partir da cabeça chego a NULL em exatamente `len` passos, e para todo nó `n->next->prev == n`".
  misconceptions:
    - claim: Inserir no meio de uma lista ligada é O(1), então ela é melhor que array para inserções.
      correction: É O(1) só se você já tem o ponteiro para a posição. Encontrar a posição é O(n) com cache misses; na prática, deslocar elementos de um array costuma ser mais rápido até tamanhos bem grandes.
    - claim: Listas e arrays com o mesmo O(n) de percurso têm desempenho parecido.
      correction: O percurso da lista é limitado pela latência da memória (dependência entre cargas), enquanto o do array aproveita linhas de cache e prefetch. A diferença real pode ser de uma ordem de grandeza.
    - claim: Liberar a lista com `for (p = head; p; p = p->next) free(p);` é correto.
      correction: Lê `p->next` depois de `free(p)` — use-after-free. Guarde o próximo antes de liberar.
  resources:
    start: ods-linked-lists
    deeper: [ods-3-3-selist, beej-c-structs, drepper-memory-3-3-2-measurements-of-cache-effects, valgrind-quickstart]
    videos: [cs61b-2019-lecture-4-sllists, cs61b-2019-lecture-5-dllists-arrays, mit-6006-lecture-2-data-structures-dynamic-arrays-linked-lists, scott-meyers-cpu-caches-why-you-care-data-structures-and-locality, mike-acton-data-oriented-design-cppcon-2014-memory-access-and-performance]
  exercise:
    id: ex-dlist-invariants
    title: Lista duplamente ligada com verificador de invariantes
    prediction: Desenhe os ponteiros de uma lista com sentinela circular contendo 2 elementos. Quantos ponteiros mudam ao remover o primeiro?
    steps:
      - "Implemente em C uma lista duplamente ligada com sentinela circular: `push_front`, `push_back`, `remove_node`, `find` e `free_all`."
      - "Escreva `check_invariants(list)` que verifica: percorrer `next` volta à sentinela em `len` passos, e `n->next->prev == n` para todo nó."
      - Chame o verificador após cada operação num teste com 100 mil operações aleatórias comparando com um array de referência.
      - "Introduza de propósito o bug de liberar com `p = p->next` depois do `free` e rode com Valgrind e ASan."
      - Desenhe (caixas e setas) o estado antes e depois de cada operação de um caso pequeno.
    checks:
      - O teste aleatório termina sem violar invariantes e com conteúdo igual ao array de referência.
      - Valgrind/ASan apontam a linha do use-after-free introduzido; após a correção, zero erros e zero leaks.
      - Os desenhos batem com os endereços impressos no gdb para o caso pequeno.
  experiment:
    title: Lista contra array — o custo de seguir ponteiros
    steps:
      - "Numa pasta de laboratório, crie n inteiros como array contíguo e como lista ligada com nós alocados em ordem, e outra lista com nós embaralhados (aloque todos, embaralhe a ordem de ligação)."
      - Some todos os elementos nas três estruturas para n de 1e3 a 1e7 e registre ns/elemento (mediana de 5).
      - "Rode `perf stat -e cache-misses,cycles,instructions` nas três versões com n = 1e7."
      - "Compare inserção no meio: array com `memmove` versus lista com busca linear até a posição, para n = 1e4 e 1e5."
    observe:
      - A lista embaralhada fica muito mais lenta por elemento que a lista em ordem, que por sua vez perde para o array.
      - Os cache-misses da lista embaralhada e o IPC baixo; a inserção no array com memmove vencendo a lista mesmo sendo O(n).
  reflectionQuestions:
    - Por que o mesmo código de percurso fica mais lento só porque os nós foram ligados em outra ordem?
    - Quando uma lista ligada é a escolha certa num sistema real (pense em LRU, listas intrusivas do kernel, filas de espera)?
    - Como o nó sentinela muda a prova de correção da remoção?
  completionCriteria:
    - Mostra a lista duplamente ligada passando 100 mil operações aleatórias com o verificador de invariantes ativo.
    - Apresenta relatório do Valgrind ou ASan para o use-after-free introduzido e a execução limpa após a correção.
    - Mostra tabela de ns/elemento e cache-misses para array, lista em ordem e lista embaralhada.
  evidencePrompts:
    - Código do verificador de invariantes e saída do teste aleatório.
    - Tabela/gráfico da comparação com o trecho do perf stat.
  firstAction: Desenhe três caixas ligadas por setas e escreva a ordem exata das atribuições para inserir uma quarta no meio sem perder nenhuma.
  kit:
    - term: "struct node { int val; struct node *next, *prev; }"
      use: "Representar o nó; cada um é alocado à parte e ligado pelos ponteiros."
    - term: "next = p->next; free(p); p = next;"
      use: "Liberar a lista sem ler memória já liberada (use-after-free)."
    - term: "node **pp = &head"
      use: "Inserir ou remover sem caso especial para a cabeça; um nó sentinela resolve o mesmo."
    - term: "check_invariants: fim em len passos, n->next->prev == n"
      use: "Rodar após cada operação nos testes para pegar uma religação errada na hora."
    - term: "valgrind --leak-check=full ./prog"
      use: "Achar use-after-free e nós vazados com a linha exata do erro."
    - term: "ArrayList / ArrayDeque em vez de LinkedList"
      use: "Ficar com estruturas contíguas por padrão; lista só quando já tem o nó e precisa inserir ou remover no meio."
  deepDive:
    - title: Listas intrusivas e container_of
      why: Quando ler código do kernel Linux ou escrever alocadores e escalonadores que evitam uma alocação por elemento.
    - title: Cache LRU com hash e lista duplamente ligada
      why: Quando implementar um cache com despejo do item menos usado recentemente em O(1).
    - title: Skip lists
      why: Quando precisar de uma estrutura ordenada simples de implementar e de tornar concorrente (como os sorted sets do Redis).
      resource: ods-skiplists
    - title: Listas lock-free e o problema ABA
      why: Quando chegar a estruturas concorrentes sem locks e precisar entender por que reusar nós quebra o compare-and-swap.
      resource: preshing-lock-free-intro

- id: stacks-queues
  stage: s05-algorithms-basics
  title: Pilhas e filas
  status: authored
  objective: Implementar pilhas e filas (inclusive buffer circular) e reconhecê-las em sistemas reais.
  whyItMatters: Chamadas de função, desfazer/refazer, filas de jobs e buffers de rede são pilhas e filas. O buffer circular é a estrutura por trás de pipes, sockets e filas entre threads.
  prerequisites: [dynamic-arrays, linked-lists]
  related: [bounded-queues, graphs-traversal, stack-heap-lifetime, tokenizing-parsing]
  mathThreads: [proofs]
  explanation: |
    **Pilha** e **fila** são interfaces definidas pela ordem de saída. A pilha é **LIFO** (o último a entrar é o primeiro a sair: `push`/`pop`); a fila é **FIFO** (`enqueue`/`dequeue`). Ambas prometem `O(1)` por operação; a pergunta é com qual estrutura cumprir isso.

    A **pilha** sobre array dinâmico é natural: `push` escreve em `data[top++]`, `pop` lê `data[--top]`. A **call stack** do processo é exatamente isso, com frames em vez de inteiros; recursão profunda demais esgota a área reservada. Pilhas também aparecem em desfazer/refazer, avaliação de expressões, verificação de parênteses e DFS iterativa.

    A **fila** sobre array tem um problema: remover do início deslocando tudo custa `O(n)`. O **buffer circular** resolve com dois índices, `head` (próximo a sair) e `tail` (próximo a entrar), que avançam módulo a capacidade: `tail = (tail + 1) % cap`. Ninguém se desloca; os índices dão a volta. Detalhes que pegam:

    - Distinguir **cheio** de **vazio** (ambos têm `head == tail`): guarde `count` ou deixe uma posição sempre livre.
    - Com `cap` potência de 2, `% cap` vira `& (cap - 1)`, o truque usado no kernel.
    - Ao crescer, copie os elementos **na ordem lógica** (de `head` dando a volta), não o bloco cru.

    Filas **limitadas** (capacidade fixa) são uma decisão de projeto: quando enchem, o produtor espera, descarta ou recebe erro — isso é *backpressure*. Uma fila ilimitada só esconde o problema até a memória acabar. Esse é o ponto de partida para as filas entre threads da etapa de concorrência.
  misconceptions:
    - claim: Uma fila precisa de lista ligada para ter dequeue O(1).
      correction: Um buffer circular sobre array dá O(1) sem uma alocação por elemento e com melhor localidade; é o que ArrayDeque e o kernel usam.
    - claim: head == tail significa fila vazia.
      correction: No buffer circular, também pode significar cheia. É preciso um contador ou sacrificar uma posição para distinguir.
    - claim: Uma fila sem limite de tamanho é mais robusta.
      correction: Se o produtor é mais rápido que o consumidor, ela cresce até esgotar a memória e a latência explode. Limitar e definir o que fazer quando enche (backpressure) é mais robusto.
  resources:
    start: ods-array-based-lists
    deeper: [ods-linked-lists, linux-kernel-circular-buffers, java-arraydeque-21]
    videos: [mit-6006-lecture-2-data-structures-dynamic-arrays-dynamic-sequence-operations, cs61b-2019-lecture-5-dllists-arrays]
  exercise:
    id: ex-ring-buffer
    title: Buffer circular com testes de fronteira
    prediction: Numa fila circular de capacidade 4, faça enqueue de 1,2,3, dequeue de 2 elementos e enqueue de 4,5,6. Escreva os valores de head, tail e o conteúdo do array em cada passo.
    steps:
      - "Implemente em C `struct ring { int *buf; size_t head, tail, count, cap; }` com `ring_push`, `ring_pop`, `ring_full`, `ring_empty`, devolvendo erro (não abortando) quando cheia."
      - Escreva testes que dão várias voltas no array e conferem a ordem FIFO contra uma fila de referência simples.
      - "Implemente uma pilha sobre o seu vetor dinâmico e use-a para verificar parênteses balanceados em `(a[b]{c})`."
      - Adicione a versão que cresce, copiando na ordem lógica; crie um teste que falha se você copiar o bloco cru.
      - Troque `% cap` por `& (cap - 1)` exigindo cap potência de 2 e verifique com `assert`.
    checks:
      - O estado de head/tail/conteúdo impresso bate com a previsão feita no papel.
      - Os testes de várias voltas e de crescimento passam, e o teste de cópia crua falha quando o bug é introduzido.
      - O verificador de parênteses rejeita `(]` e `((` e aceita expressões balanceadas.
  experiment:
    title: Filas e pilhas reais no Linux
    steps:
      - "Numa pasta de laboratório, rode `yes | pv -L 1k > /dev/null` ou um produtor rápido e um consumidor lento ligados por pipe, e use `strace -e write` no produtor para ver o write bloquear quando o buffer do pipe enche."
      - "Descubra a capacidade do pipe com `fcntl(fd, F_GETPIPE_SZ)` num pequeno programa em C."
      - "Num programa recursivo, use o gdb (`bt`) para ver a call stack como pilha de frames, e reduza `ulimit -s` até provocar stack overflow."
      - Simule uma fila de jobs com seu buffer circular limitado e um produtor 2x mais rápido; compare descartar, bloquear (espera ativa simulada) e crescer sem limite, medindo memória e itens perdidos.
    observe:
      - O write do produtor parando quando o pipe enche (backpressure do kernel) e o tamanho do buffer devolvido por F_GETPIPE_SZ.
      - O backtrace mostrando os frames empilhados e a profundidade em que o stack overflow acontece.
  reflectionQuestions:
    - Por que pipes e sockets usam buffers de tamanho fixo em vez de crescerem sem limite?
    - Que estrutura você usaria para desfazer/refazer num editor e por quê duas pilhas resolvem?
    - Que decisão de produto está escondida em "o que fazer quando a fila de jobs enche"?
  completionCriteria:
    - Mostra o buffer circular passando testes que dão várias voltas e cobrem cheio, vazio e crescimento.
    - Apresenta saída do strace mostrando o produtor bloqueado num pipe cheio e o valor de F_GETPIPE_SZ.
    - Mostra a comparação de políticas de fila cheia com memória usada e itens descartados.
  evidencePrompts:
    - Tabela de head/tail prevista no papel ao lado da saída do programa.
    - Trecho do strace do pipe e a tabela da simulação de fila de jobs.
  firstAction: Desenhe um array de 4 posições em círculo e marque head e tail após três enqueues e um dequeue.
  kit:
    - term: "ArrayDeque: push/pop (pilha), offer/poll (fila)"
      use: "Usar uma só classe em Java para pilha e fila, no lugar de `Stack` e `LinkedList`."
    - term: "data[top++] = x;  x = data[--top];"
      use: "Implementar pilha em C sobre um vetor dinâmico."
    - term: "tail = (tail + 1) % cap"
      use: "Avançar os índices do buffer circular; com cap potência de 2, use `& (cap - 1)`."
    - term: "count == 0 (vazia) / count == cap (cheia)"
      use: "Distinguir cheio de vazio no buffer circular, já que ambos têm head == tail."
    - term: "fila limitada: bloquear, descartar ou erro"
      use: "Definir o que acontece quando a fila enche (backpressure) em vez de crescer até faltar memória."
    - term: "gdb: bt"
      use: "Ver a call stack como pilha de frames e descobrir onde a recursão ficou profunda demais."
  deepDive:
    - title: Filas entre threads (mutex + condition variable)
      why: Na etapa de concorrência, quando produtor e consumidor rodarem em threads diferentes e a fila precisar bloquear com segurança.
      resource: ostep-condition-variables
    - title: Ring buffers do kernel e filas lock-free SPSC
      why: Quando precisar passar dados entre um produtor e um consumidor com latência mínima (drivers, áudio, pipelines de rede).
      resource: linux-kernel-circular-buffers
    - title: Filas de mensagens duráveis
      why: Quando jobs do backend precisarem sobreviver a quedas e você tiver de escolher entre entrega at-most-once e at-least-once.
      resource: rabbitmq-reliability-guide
    - title: Sobrecarga, filas e descarte de carga
      why: Quando dimensionar filas de um serviço sob pico e decidir quanto enfileirar antes de rejeitar requisições.
      resource: sre-book-handling-overload
    - title: Pilha e fila monotônicas
      why: Quando resolver problemas de janela deslizante, como máximo em janela ou próximo elemento maior, em O(n).
