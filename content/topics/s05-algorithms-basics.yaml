# s05-algorithms-basics

- id: complexity-analysis
  stage: s05-algorithms-basics
  title: Análise de complexidade
  status: authored
  objective: Estimar como tempo e memória crescem com a entrada usando notação O, e confirmar a estimativa com medições.
  whyItMatters: Permite prever se uma solução aguenta 10x mais dados antes de descobrir em produção. É também a linguagem comum para discutir trade-offs em code review, em índices de banco e em escolhas de estrutura de dados no backend.
  prerequisites: [dynamic-allocation-ownership, cpu-memory-caches]
  related: [searching-sorting, dynamic-arrays, profiling-benchmarks]
  mathThreads: [proofs, combinatorics]
  explanation: |
    Análise de complexidade responde: **quando a entrada dobra, o que acontece com o custo?** Em vez de cronometrar uma máquina específica, contamos operações básicas (comparações, acessos à memória, iterações) em função do tamanho `n` e olhamos só o termo que domina quando `n` cresce.

    A notação formaliza isso. `f(n) = O(g(n))` quer dizer que existem constantes `c` e `n0` tais que `f(n) <= c·g(n)` para todo `n >= n0` — um **limite superior**. `Ω` é o limite inferior e `Θ` é os dois ao mesmo tempo. Dois laços aninhados de `0` a `n` fazem `n·n` iterações; um laço que divide o intervalo pela metade a cada passo faz cerca de `log2 n`. Contar é **combinatória**: somas como `1 + 2 + ... + n = n(n+1)/2` explicam por que "para cada i, percorra até i" ainda é quadrático.

    Três cuidados separam análise útil de decoreba:

    - **Qual caso?** Pior caso, caso médio (com que distribuição de entrada?) e custo **amortizado** (média ao longo de uma sequência de operações) são perguntas diferentes.
    - **Constantes importam em `n` real.** O modelo RAM supõe que todo acesso à memória custa igual, mas um *cache miss* custa ~100x um acerto. Dois algoritmos `O(n)` podem diferir 10x por localidade.
    - **Memória também é custo**: espaço auxiliar, alocações e quantas páginas o programa toca.

    A forma honesta de usar a teoria é como **hipótese**: preveja a curva, meça com tamanhos crescentes (dobrando `n`) e compare a razão `T(2n)/T(n)` — perto de 2 sugere linear, perto de 4 sugere quadrático. Quando a medição discorda da previsão, há algo no mecanismo (cache, alocação, branch prediction) que o modelo ignorou.
  misconceptions:
    - claim: O(n) é sempre mais rápido que O(n²).
      correction: A notação esconde constantes e vale para n grande. Para n pequeno, um algoritmo quadrático com bom acesso à memória (insertion sort) costuma vencer; por isso bibliotecas misturam algoritmos.
    - claim: O descreve o pior caso e Θ o caso médio.
      correction: O, Ω e Θ são limites sobre uma função; pior caso, caso médio e amortizado escolhem qual função está sendo limitada. Dá para falar do pior caso em Θ.
    - claim: Se o tempo medido de uma execução foi baixo, o algoritmo escala bem.
      correction: Um ponto não mostra crescimento. É preciso medir vários tamanhos, repetir e olhar a razão entre tamanhos consecutivos.
  resources:
    start: algs4-analysis-of-algorithms
    deeper: [mit-6006-lecture-notes-1-introduction, ods-introduction, mcs-cap14-sums-asymptotics, drepper-memory-3-cpu-caches]
    videos: [mit-6006-lecture-1-algorithms-computation-efficiency, mit-6006-lecture-1-algorithms-computation, cs61b-2019-lecture-13-asymptotics-1, scott-meyers-cpu-caches-why-you-care-cache-lines-and-prefetching]
  exercise:
    id: ex-count-operations
    title: Contar operações à mão e provar a soma
    prediction: Para três funções em C (um laço simples, dois laços aninhados com `j < i`, e um laço que faz `i *= 2`), escreva quantas vezes a linha mais interna executa para n = 8, 16 e 1024, e a ordem de crescimento.
    steps:
      - Escreva as três funções com um contador global `ops` incrementado na linha interna.
      - "Calcule à mão a fórmula fechada de cada uma (ex.: `n(n-1)/2` para o laço triangular) e prove a soma por indução."
      - Rode para n = 8, 16, 32, ..., 2^20 e imprima `ops` e a razão `ops(2n)/ops(n)`.
      - Compare a contagem com a sua fórmula e com a previsão; explique qualquer diferença (off-by-one, arredondamento de log).
    checks:
      - A contagem impressa bate exatamente com a fórmula fechada para todos os n testados.
      - A prova por indução tem caso base e passo indutivo escritos.
      - As razões tendem a 2, 4 e ~1 (logarítmico) e você explica por quê.
  experiment:
    title: Quando a medição desmente o modelo RAM
    steps:
      - "Numa pasta de laboratório, escreva `sum.c` que soma um array de `int` de tamanho n de duas formas: sequencial (`i = 0..n-1`) e com saltos (`i = (i + 4099) % n`, visitando todos os índices quando n é potência de 2)."
      - "Compile com `-O2 -g`, meça com `clock_gettime(CLOCK_MONOTONIC)` para n de 2^10 a 2^26, repetindo 5 vezes e guardando a mediana em CSV."
      - Calcule o tempo por elemento (ns/elemento) e plote contra n em escala log.
      - "Rode `perf stat -e cache-misses,cache-references,instructions,cycles ./sum` para um n pequeno (cabe no L1/L2) e um grande (maior que o L3) nos dois modos."
      - Escreva uma hipótese sobre onde a curva muda de patamar a partir dos tamanhos de cache vistos em `lscpu`.
    observe:
      - Os dois modos são O(n), mas o tempo por elemento do modo com saltos sobe em degraus perto dos tamanhos de L1, L2 e L3.
      - A diferença de cache-misses entre os modos no n grande, e o IPC (instructions/cycles) caindo.
  reflectionQuestions:
    - Por que dobrar n e olhar a razão é mais informativo do que medir um único tamanho grande?
    - Que suposição do modelo RAM o seu experimento quebrou, e quando ela ainda é uma boa aproximação?
    - Num endpoint do backend que lista tarefas, onde um custo O(n²) poderia se esconder sem ninguém perceber até a base crescer?
  completionCriteria:
    - Mostra contagem de operações impressa que coincide com a fórmula fechada derivada à mão para três laços.
    - Apresenta CSV e gráfico de ns/elemento por n com degraus associados aos tamanhos de cache do `lscpu`.
    - Mostra a saída de `perf stat` comparando cache-misses entre acesso sequencial e com saltos.
  evidencePrompts:
    - Tabela n × ops × razão e a prova por indução da soma triangular.
    - Gráfico de tempo por elemento com anotações dos níveis de cache e a saída do perf stat.
  firstAction: Escreva no papel quantas vezes `for (i = 1; i < n; i *= 2)` executa para n = 16 e n = 1000.
  kit:
    - term: "Big-O: O(1), O(log n), O(n), O(n log n), O(n²)"
      use: "Comparar soluções e prever se ainda cabem com n = 1e6 (n² já são 1e12 operações)."
    - term: "laços aninhados multiplicam; i *= 2 dá log n"
      use: "Contar quantas vezes o corpo roda em função de n só lendo o código."
    - term: "T(2n)/T(n)"
      use: "Confirmar a ordem medindo vários tamanhos com mediana: razão ≈2 indica linear, ≈4 quadrático."
    - term: "clock_gettime(CLOCK_MONOTONIC, &t)"
      use: "Medir o tempo de um trecho em C sem sofrer com ajustes do relógio do sistema."
    - term: "perf stat -e cache-misses,instructions,cycles ./prog"
      use: "Descobrir se a diferença de tempo entre dois algoritmos de mesmo O vem de cache misses."
    - term: "contains / query dentro de laço"
      use: "Caçar o O(n²) escondido: busca linear, `contains` ou uma query por item (N+1) dentro de um laço."
  deepDive:
    - title: Recorrências e Master Theorem
      why: Quando precisar estimar algoritmos de divisão e conquista (merge sort, busca binária, árvores) sem depender só de medição.
      resource: mcs-cap22-recurrences
    - title: Análise amortizada formal (método do potencial)
      why: Quando provar o custo de estruturas com operações caras ocasionais, como resize de tabelas e union-find.
      resource: mit-6006-lecture-notes-2-data-structures
    - title: Modelo de memória externa e algoritmos cache-aware
      why: Quando os dados não cabem no cache ou na RAM e o custo real passa a ser contar linhas de cache ou páginas lidas.
      resource: drepper-memory-6-what-programmers-can-do
    - title: Limites inferiores e NP-completude
      why: Quando suspeitar que um problema (escalonamento, roteamento) não tem solução exata eficiente e for hora de aceitar heurísticas.
      resource: mit-6006-lecture-notes-19-complexity

- id: searching-sorting
  stage: s05-algorithms-basics
  title: Busca e ordenação
  status: authored
  objective: Implementar busca linear e binária e algoritmos de ordenação, comparando invariantes, estabilidade e desempenho medido.
  whyItMatters: Ordenar e buscar estão por trás de índices, paginação e quase toda manipulação de dados. Saber o invariante de uma busca binária evita os off-by-one que derrubam implementações "simples" há décadas.
  prerequisites: [complexity-analysis]
  related: [binary-search-trees, heaps-priority-queues, indexes]
  mathThreads: [proofs, combinatorics]
  explanation: |
    **Busca linear** olha cada elemento: `O(n)`, funciona em qualquer ordem. **Busca binária** exige um array ordenado e descarta metade do intervalo por comparação: `O(log n)`. O difícil não é a ideia, é a fronteira. A técnica que evita erros é escrever o **invariante de laço**: "se o alvo existe, ele está em `a[lo..hi)`". Cada passo precisa (1) manter o invariante e (2) encolher o intervalo; quando `lo == hi`, o invariante diz a resposta. Isso é uma prova: inicialização, manutenção e término.

    Ordenações por comparação também se explicam por invariantes:

    - **Insertion sort**: `a[0..i)` está ordenado; insere `a[i]` deslocando os maiores. `O(n²)` no pior caso, mas linear quase ordenado e muito amigo do cache.
    - **Merge sort**: divide, ordena as metades e intercala; `O(n log n)` sempre, precisa de `O(n)` de memória extra, é **estável** (iguais mantêm a ordem original).
    - **Quicksort**: particiona em torno de um pivô; `O(n log n)` esperado, `O(n²)` com pivô ruim (array já ordenado e pivô no extremo).

    Existe um limite: qualquer ordenação **só por comparação** precisa de `Ω(n log n)` comparações no pior caso, porque há `n!` ordens possíveis e cada comparação no máximo divide as possibilidades ao meio (`log2(n!) ≈ n log2 n`). Counting sort e radix sort escapam disso porque não comparam — olham os dígitos da chave.

    **Estabilidade** importa quando se ordena por várias chaves: ordenar tarefas por prazo e depois, de forma estável, por prioridade deixa tarefas de mesma prioridade ainda ordenadas por prazo. Na prática, bibliotecas usam híbridos (introsort, Timsort) que trocam de algoritmo conforme o tamanho e o padrão dos dados.
  misconceptions:
    - claim: Busca binária é trivial de implementar.
      correction: Variações em `mid`, `<` vs `<=` e `hi = mid` vs `hi = mid - 1` geram laços infinitos e acessos fora do array. Sem um invariante explícito, é fácil errar; `(lo + hi) / 2` ainda pode estourar int com arrays enormes.
    - claim: Quicksort é sempre o mais rápido.
      correction: É rápido em média, mas degrada para O(n²) com pivô ruim e não é estável. Para entradas quase ordenadas, insertion sort ou Timsort vencem.
    - claim: Nenhum algoritmo de ordenação pode ser melhor que O(n log n).
      correction: O limite vale para ordenação baseada em comparações. Counting e radix sort são lineares quando as chaves têm faixa ou tamanho limitado.
  resources:
    start: mit-6006-lecture-notes-3-sorting
    deeper: [ods-sorting-algorithms, man-bsearch, man-qsort, mcs-cap6-state-machines]
    videos: [mit-6006-lecture-3-sets-sorting, cs61b-2019-lecture-29-basic-sorts]
  exercise:
    id: ex-binary-search-invariant
    title: Busca binária com invariante provado
    prediction: Para `a = {1, 3, 3, 3, 7}` e alvo 3, que índice a sua busca devolve? E para alvo 4 e alvo 8? Escreva antes de implementar.
    steps:
      - "Escreva em C `size_t lower_bound(const int *a, size_t n, int x)` que devolve o primeiro índice com `a[i] >= x`, usando o intervalo semiaberto `[lo, hi)`."
      - Escreva o invariante como comentário e prove inicialização, manutenção e término (por que o laço sempre encolhe?).
      - Teste contra uma busca linear em 100 mil arrays aleatórios pequenos (tamanhos 0 a 20, valores repetidos) e compare as respostas.
      - Introduza de propósito um bug (`hi = mid - 1`) e veja o teste aleatório encontrar o contraexemplo mínimo.
      - Implemente insertion sort e merge sort e verifique estabilidade ordenando structs `{chave, posicao_original}`.
    checks:
      - O teste aleatório passa em 100 mil casos e falha com o bug introduzido, mostrando a entrada que quebrou.
      - O comentário do invariante cobre os três passos da prova.
      - A verificação de estabilidade mostra merge sort estável e uma variante instável (ex. selection sort) falhando.
  experiment:
    title: Corrida de ordenações com entradas adversárias
    steps:
      - "Numa pasta de laboratório, gere entradas de n = 1e3 a 1e7 em quatro formatos: aleatória, já ordenada, invertida e com poucos valores distintos."
      - Meça insertion sort (até 1e5), merge sort, um quicksort com pivô no último elemento e `qsort` da libc, guardando a mediana de 5 execuções.
      - Conte comparações com um contador global além do tempo, e compare com `n log2 n`.
      - "Rode o quicksort ingênuo no array já ordenado com n grande e observe o tempo e a profundidade de recursão (ou o crash por stack overflow com `ulimit -s`)."
      - Troque para pivô aleatório ou mediana-de-três e repita.
    observe:
      - O quicksort ingênuo em entrada ordenada vira quadrático (e pode estourar a stack), enquanto o pivô aleatório volta a n log n.
      - Insertion sort vence em n pequeno e em entrada já ordenada; a contagem de comparações acompanha a teoria.
  reflectionQuestions:
    - Por que um invariante escrito antes do código torna a busca binária mais fácil de acertar do que testar "na mão"?
    - Onde a estabilidade de ordenação aparece numa listagem paginada de tarefas ordenada por duas colunas?
    - O que o argumento das n! permutações diz sobre qualquer algoritmo que você ainda vá inventar?
  completionCriteria:
    - Mostra `lower_bound` com invariante comentado passando em 100 mil testes aleatórios contra busca linear.
    - Apresenta tabela de tempo e comparações por algoritmo e formato de entrada, incluindo o caso quadrático do quicksort ingênuo.
    - Demonstra com saída de teste qual ordenação é estável e qual não é.
  evidencePrompts:
    - Código da busca com o invariante e a saída do teste aleatório pegando o bug introduzido.
    - Tabela/gráfico da corrida de ordenações com uma frase explicando cada anomalia.
  firstAction: Escreva num comentário o invariante "se x existe, está em a[lo..hi)" e desenhe lo e hi num array de 5 elementos.
  kit:
    - term: "qsort / bsearch, Arrays.sort / Collections.binarySearch"
      use: "Ordenar e buscar no dia a dia com a biblioteca, que já é testada e otimizada."
    - term: "lo = 0, hi = n; mid = lo + (hi - lo) / 2"
      use: "Escrever busca binária no intervalo semiaberto [lo, hi) sem overflow nem laço infinito; pare quando lo == hi."
    - term: "invariante: se x existe, está em a[lo..hi)"
      use: "Fixar antes do código o que cada passo preserva; é isso que garante término e resposta certa."
    - term: "teste aleatório contra busca linear / insertion sort"
      use: "Comparar sua versão com uma ingênua em milhares de entradas pequenas com valores repetidos."
    - term: "Comparator.comparing(a).thenComparing(b)"
      use: "Ordenar por várias chaves num só passo; `List.sort` é estável e mantém empates na ordem original."
  deepDive:
    - title: Partição de 3 vias, pivô aleatório e introsort
      why: Quando os dados têm muitas chaves repetidas ou você precisa de garantia de pior caso numa ordenação própria.
      resource: algs4-quicksort
    - title: Counting sort e radix sort
      why: Quando ordenar milhões de chaves inteiras de faixa limitada (ids, IPs, datas) e o limite n log n da comparação pesar.
      resource: ods-sorting-algorithms
    - title: Timsort e ordenação adaptativa
      why: Quando quiser entender por que dados quase ordenados ordenam tão rápido em Java e Python, e o que isso implica para benchmarks.
    - title: Ordenação externa (external merge sort)
      why: Quando os dados não cabem na memória, como num `ORDER BY` grande no banco ou ao ordenar arquivos de log gigantes.
      resource: cmu-15445-f24-lecture-11-sorting-notes
    - title: Busca binária sobre a resposta
      why: Quando otimizar um parâmetro monotônico (capacidade mínima, primeiro commit ruim com `git bisect`) em vez de um array.

- id: dynamic-arrays
  stage: s05-algorithms-basics
  title: Arrays dinâmicos
  status: authored
  objective: Analisar o custo amortizado do redimensionamento e comparar estratégias de crescimento.
  whyItMatters: ArrayList em Java, arrays em JavaScript e vetores em geral funcionam assim. Entender o redimensionamento explica picos de latência, uso de memória inesperado e por que ponteiros para dentro de um vetor podem ficar inválidos.
  prerequisites: [complexity-analysis, dynamic-allocation-ownership]
  related: [hash-tables, stacks-queues, memory-allocators]
  mathThreads: [proofs, combinatorics]
  explanation: |
    Um **array dinâmico** guarda três coisas: um ponteiro para um bloco contíguo, o `len` (quantos elementos estão em uso) e a `cap` (quantos cabem). `push` escreve em `data[len++]` enquanto `len < cap`. Quando enche, aloca um bloco maior, copia tudo e libera o antigo — em C, `realloc` faz isso e **pode mover o bloco**, invalidando qualquer ponteiro para elementos antigos.

    A estratégia de crescimento decide tudo:

    - **Crescer somando** uma constante `k`: a cada `k` pushes há uma cópia de tudo. O total copiado é `k + 2k + 3k + ... ≈ n²/(2k)` — quadrático.
    - **Crescer multiplicando** por um fator `r > 1` (2 ou 1,5): as cópias somam `1 + 2 + 4 + ... + n < 2n`. Dividindo pelos `n` pushes, cada um custa `O(1)` **amortizado**, mesmo que um push isolado custe `O(n)`.

    A prova clássica é o **método do banqueiro**: cobre 3 "moedas" por push — 1 paga a escrita e 2 ficam guardadas. Quando a capacidade dobra de `c` para `2c`, os `c/2` elementos inseridos desde a última cópia guardaram `c` moedas, exatamente o necessário para copiar os `c` elementos. O saldo nunca fica negativo, então o custo total é no máximo `3n`.

    Encolher exige cuidado: se o array encolher pela metade quando ficar meio cheio, alternar push/pop na fronteira causa cópias a cada operação (*thrashing*). A solução é encolher só quando chegar a 1/4. O fator também é um trade-off: 2 desperdiça até metade da memória; 1,5 desperdiça menos e, com alguns alocadores, permite reaproveitar blocos liberados.
  misconceptions:
    - claim: Amortizado O(1) significa que todo push é rápido.
      correction: Um push que dispara o resize custa O(n) e pode causar um pico de latência. Amortizado é a média ao longo da sequência, não uma garantia por operação.
    - claim: Depois de realloc, o ponteiro antigo continua válido se o tamanho só aumentou.
      correction: realloc pode mover o bloco; o ponteiro antigo e qualquer ponteiro para elementos ficam pendurados. Sempre use o valor devolvido (e trate NULL sem perder o original).
    - claim: Crescer de 1000 em 1000 elementos é tão bom quanto dobrar.
      correction: Crescimento aditivo torna o total de cópias quadrático em n; só o crescimento geométrico dá custo amortizado constante.
  resources:
    start: ods-array-based-lists
    deeper: [ods-2-6-rootisharraystack, java-arraylist-21, man-malloc, beej-c-malloc]
    videos: [mit-6006-lecture-2-data-structures-dynamic-arrays, cs61b-2019-lecture-6-alists]
  exercise:
    id: ex-vec-amortized
    title: Vetor dinâmico com contador de cópias
    prediction: Quantos elementos no total serão copiados ao fazer 1 milhão de pushes começando com cap = 1, dobrando? E crescendo de 1000 em 1000? Faça a conta antes.
    steps:
      - "Implemente em C `struct vec { int *data; size_t len, cap; }` com `vec_push`, `vec_get`, `vec_pop` e `vec_free`, documentando ownership no header."
      - "Trate falha de `realloc` sem vazar o bloco antigo (`tmp = realloc(...); if (!tmp) ...`)."
      - Adicione um contador global de elementos copiados e rode 1 milhão de pushes com fator 2, fator 1,5 e incremento fixo de 1000.
      - Escreva a prova do método do banqueiro para o fator 2 e compare o bound 3n com o contador.
      - "Implemente encolhimento e provoque thrashing de propósito (encolher a 1/2), depois corrija (encolher a 1/4)."
    checks:
      - O contador de cópias com fator 2 fica abaixo de 2n e o aditivo cresce perto de n²/2000.
      - A suíte roda limpa com `-fsanitize=address` e com Valgrind.
      - A sequência push/pop na fronteira mostra o número de cópias explodindo na versão ingênua e não na corrigida.
  experiment:
    title: Picos de latência e ponteiros inválidos no resize
    project: dynamic-array-hash-table
    steps:
      - No projeto, meça o tempo de cada push individual (clock_gettime) para 10 milhões de pushes e grave em arquivo.
      - Plote latência por push; marque onde a capacidade dobrou.
      - "Guarde `int *p = &v.data[0]`, faça pushes até disparar um resize e leia `*p` com ASan ligado."
      - "Use `ltrace -e realloc` (ou um contador) para listar as chamadas de realloc e os endereços devolvidos."
      - Compare a memória máxima (`/usr/bin/time -v`, campo Maximum resident set size) com fator 2 e fator 1,5.
    observe:
      - Picos isolados de latência exatamente nas potências de 2, com a maioria dos pushes na faixa de nanossegundos.
      - O relatório heap-use-after-free do ASan ao ler pelo ponteiro antigo, e o endereço mudando entre reallocs.
  reflectionQuestions:
    - Por que dar a todo push o mesmo "preço" de 3 moedas é uma prova válida, mesmo que o trabalho real seja irregular?
    - Num servidor com requisito de latência p99, quando você pré-alocaria capacidade (ensureCapacity em Java) em vez de confiar no amortizado?
    - Que tipo de bug em C aparece quando uma função guarda ponteiro para um elemento de um vetor que outra função faz crescer?
  completionCriteria:
    - Mostra o contador de cópias para 1 milhão de pushes com fator 2, 1,5 e aditivo, comparado com as contas feitas antes.
    - Apresenta gráfico de latência por push com picos nas potências de 2.
    - Reproduz e explica o relatório do ASan de uso de ponteiro antigo após realloc.
  evidencePrompts:
    - Prova escrita do método do banqueiro e saída do contador de cópias.
    - Gráfico de latência por push e o relatório do ASan anotado.
  firstAction: Some à mão 1 + 2 + 4 + ... + 512 e compare com 1024; escreva o que isso diz sobre o total de cópias.
  kit:
    - term: "struct vec { int *data; size_t len, cap; }"
      use: "Guardar o essencial de um vetor: ponteiro para o bloco, quantos estão em uso e quantos cabem."
    - term: "cap *= 2 (ou cap += cap / 2)"
      use: "Crescer de forma geométrica para `push` ser O(1) amortizado; nunca some uma constante."
    - term: "tmp = realloc(p, cap * sizeof *p); if (!tmp) ..."
      use: "Crescer o bloco em C sem perder o original se falhar; o endereço pode mudar, então não guarde ponteiros antigos."
    - term: "new ArrayList<>(n) / ensureCapacity(n)"
      use: "Pré-alocar quando sabe o tamanho e evitar cópias e picos de latência no resize."
    - term: "a[i] = a[--len]"
      use: "Remover em O(1) quando a ordem não importa, trocando pelo último em vez de deslocar."
    - term: "-fsanitize=address"
      use: "Pegar o uso de ponteiro para um elemento depois de um realloc que moveu o bloco."
  deepDive:
    - title: Método do potencial
      why: Quando precisar provar custos amortizados de estruturas mais complexas que o vetor (tabelas que crescem e encolhem, filas com duas pilhas).
      resource: mit-6006-lecture-notes-2-data-structures
    - title: Interação com o alocador (fator 1,5 vs 2, reuso de blocos)
