  exercise:
    id: ex-bounded-buffer
    title: Buffer circular limitado com duas variáveis de condição
    prediction: "Com capacidade 4, 1 produtor rápido e 1 consumidor que leva 10 ms por tarefa, quantas tarefas o produtor consegue colocar antes de bloquear? O que acontece com uma única variável de condição e signal com 2 produtores e 2 consumidores?"
    steps:
      - "Implemente `queue.h/queue.c` com `q_init(cap)`, `q_put`, `q_get`, `q_close` e `q_free`, usando buffer circular, um mutex e as condições `nao_cheia` e `nao_vazia`."
      - Escreva testes com 2 produtores e 4 consumidores processando 100.000 tarefas com ids; verifique que cada id foi processado exatamente uma vez (sem perda nem duplicação).
      - Implemente o desligamento com `q_close` (broadcast + flag) e confirme que todos os workers terminam e o join retorna.
      - Troque para uma única variável de condição com `signal` e tente reproduzir o travamento previsto.
    checks:
      - O teste de exatamente-uma-vez passa em 20 execuções seguidas e sob ThreadSanitizer sem avisos.
      - Você explica o travamento da variante com uma variável de condição em termos de quem foi acordado.
  experiment:
    title: Medir throughput por número de workers
    project: concurrent-job-processor
    steps:
      - "Crie tarefas sintéticas de dois tipos: CPU (laço de cálculo de ~1 ms) e espera (usleep de 1 ms simulando I/O)."
      - "Meça tarefas/segundo com 1, 2, 4, 8, 16 e 32 workers, 5 execuções cada, usando `clock_gettime(CLOCK_MONOTONIC)`; registre mediana e variação."
      - Compare com o número de núcleos (`nproc`) e rode `perf stat -e context-switches` nas configurações extremas.
      - Varie a capacidade da fila (1, 16, 1024) e observe o efeito no throughput e no tempo que produtores ficam bloqueados.
    observe:
      - A curva de throughput para tarefas de CPU achatando perto de nproc e a de espera continuando a crescer.
      - O número de trocas de contexto subindo com muitos workers.
  reflectionQuestions:
    - O que o limite da fila comunica ao produtor, e como isso se traduz em um backend HTTP sob carga?
    - Por que o processamento da tarefa deve ficar fora do lock da fila?
    - Como você escolheria o número de workers para tarefas de CPU e para tarefas de I/O?
  completionCriteria:
    - Mostra a fila passando no teste de exatamente-uma-vez com várias threads e sob ThreadSanitizer.
    - Demonstra o desligamento limpo de todos os workers e o travamento da variante com uma única condição.
    - Apresenta tabela ou gráfico de throughput por número de workers para tarefas de CPU e de espera, com explicação.
  evidencePrompts:
    - Código da fila, saída dos testes e relatório limpo do TSan.
    - Gráfico ou tabela de throughput com nproc anotado e a explicação da curva.
  firstAction: Desenhe um buffer circular de capacidade 4 e simule à mão três puts e dois gets, anotando head, tail e count.
  kit:
    - term: "buffer circular: head, tail, count, cap"
      use: "Guardar até cap tarefas, avançando os índices com (i + 1) % cap."
    - term: "1 mutex + cond nao_cheia + cond nao_vazia"
      use: "Bloquear produtor com fila cheia e consumidor com fila vazia, cada wait num while."
    - term: "get → unlock → processar"
      use: "Tirar a tarefa da fila dentro do lock e processá-la fora dele."
    - term: "q_close: fechada = 1 + pthread_cond_broadcast"
      use: "Desligar os workers de forma limpa quando a fila esvaziar."
    - term: "clock_gettime(CLOCK_MONOTONIC, &t)"
      use: "Medir throughput (tarefas/s) sem sofrer com ajustes do relógio do sistema."
    - term: "nproc"
      use: "Saber quantos núcleos há: workers de CPU ≈ nproc; workers de I/O podem ser mais."
  deepDive:
    - title: Filas bloqueantes prontas em Java (ArrayBlockingQueue, ThreadPoolExecutor)
      why: Ao implementar workers no backend Java em vez de escrever a fila à mão.
      resource: java-arrayblockingqueue-21
    - title: Lei de Little e teoria de filas
      why: Ao dimensionar filas, pools e timeouts de um serviço sob carga.
    - title: Filas lock-free e ring buffers
      why: Em sistemas de baixíssima latência onde o mutex da fila vira gargalo.
      resource: preshing-lock-free-intro
    - title: Semáforos contadores como alternativa às variáveis de condição
      why: Ao ler implementações clássicas de produtor-consumidor e comparar abordagens.
      resource: ostep-semaphores
    - title: Filas distribuídas (Kafka, RabbitMQ) e entrega pelo menos uma vez
      why: Quando o produtor e o consumidor estiverem em processos ou máquinas diferentes.
