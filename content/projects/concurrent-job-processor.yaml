- id: concurrent-job-processor
  title: Processador concorrente de jobs
  status: authored
  cumulative: false
  topics: [threads-basics, race-conditions-synchronization, deadlocks, bounded-queues]
  question: Como vários workers processam tarefas de uma fila compartilhada sem perder, duplicar ou travar trabalho?
  prerequisites: [threads-basics]
  minimalVersion: |
    Um programa em C com pthreads: P produtores geram N tarefas (id, tipo, custo) e as colocam
    numa fila limitada; W workers retiram e "processam" cada tarefa. No final, imprime quantas
    tarefas foram concluídas, verifica que cada id foi processado exatamente uma vez e encerra
    todos os workers de forma limpa. P, W, N e a capacidade da fila vêm de argumentos.
  extensions:
    - Prioridades (fila de prioridade com heap protegida por mutex) e medição de starvation das tarefas de baixa prioridade.
    - Retry de tarefas que falham, com limite de tentativas e fila de mortas (dead letter).
    - Métricas por worker (tarefas, tempo ocupado, tempo esperando a fila) impressas ao final.
    - Comparar a fila com mutex + variáveis de condição contra uma versão com semáforos.
    - Ler tarefas do arquivo da CLI de tarefas e gravar os resultados com salvamento atômico.
  constraints:
    - C17 com pthreads e stdatomic.h; nada de bibliotecas de filas prontas.
    - Toda a suíte roda limpa sob `-fsanitize=thread` e sob `valgrind --tool=helgrind`.
    - Processamento da tarefa sempre fora do lock da fila.
    - Ordem global de locks documentada no código sempre que mais de um lock for adquirido.
    - Benchmarks com várias execuções, mediana e descrição da máquina (nproc, CPU).
  milestones:
    - id: m0-redigitar
      title: Redigitar a referência
      description: "Redigitar à mão `threads-intro/t1.c` e `threads-cv/pc.c` (produtor/consumidor) do ostep-code. Evidência: commits incrementais, anotações sobre cada lock/wait/signal e um erro provocado (ex.: rodar `pc_single_cv.c` ou trocar `while` por `if`) com a saída registrada."
      minutes: 50
    - id: m1-race
      title: Reproduzir uma condição de corrida
      description: Versão ingênua com contador global de concluídas e fila sem lock; mostrar contagens erradas e o relatório do ThreadSanitizer.
      minutes: 50
    - id: m2-mutex
      title: Corrigir com sincronização
      description: Fila limitada com mutex e duas variáveis de condição, desligamento com close/broadcast e teste de exatamente-uma-vez.
      minutes: 75
    - id: m3-deadlock
      title: Investigar um deadlock
      description: Adicionar a operação de mover tarefas entre duas filas com dois locks, provocar o deadlock, diagnosticar com gdb e Helgrind e corrigir com ordem global.
      minutes: 50
    - id: m4-throughput
      title: Medir throughput por número de workers
      description: Medir tarefas por segundo com 1 a 32 workers para tarefas de CPU e de espera, e com capacidades de fila diferentes; explicar as curvas.
      minutes: 75
    - id: m5-report
      title: Relatório e revisão
      description: README com o desenho da fila, invariantes, ordem de locks, gráficos e respostas às perguntas de revisão.
      minutes: 25
  edgeCases:
    - Zero tarefas, zero produtores ou mais workers que tarefas.
    - Fila de capacidade 1.
    - Close chamado com tarefas ainda na fila e com workers bloqueados em get.
    - Produtor bloqueado em put quando a fila é fechada.
    - Tarefa que falha ou demora muito mais que as outras.
    - Falha de malloc ao criar a fila ou de pthread_create ao criar workers.
  failureExperiments:
    - Remover o lock da fila e mostrar tarefas perdidas ou duplicadas pelo teste de exatamente-uma-vez e pelo TSan.
    - Trocar while por if em volta de pthread_cond_wait e provocar um get numa fila vazia com vários consumidores.
    - Usar uma única variável de condição com signal e reproduzir o travamento de produtores e consumidores.
    - Inverter a ordem de locks em mover() e capturar o deadlock com `thread apply all bt` no gdb.
    - Esquecer o broadcast no close e mostrar workers que nunca terminam (join bloqueado).
  tools: [gcc, make, gdb, "valgrind --tool=helgrind", "-fsanitize=thread", "perf stat", "top -H", "/proc/<pid>/task"]
  acceptanceCriteria:
    - O teste de exatamente-uma-vez passa em pelo menos 20 execuções seguidas com várias combinações de P, W e capacidade.
    - TSan e Helgrind não reportam avisos na versão final.
    - O deadlock é reproduzido, diagnosticado com backtraces e eliminado pela ordem global de locks.
    - O desligamento termina todos os workers sem perder tarefas já enfileiradas.
    - A medição de throughput mostra várias execuções e uma explicação baseada em núcleos, contenção e espera.
  evidence:
    - Link do repositório com README, Makefile e instruções de teste e benchmark.
    - Relatório do TSan da versão ingênua e saída limpa da versão final.
    - Saída de thread apply all bt do deadlock anotada e o grafo de espera.
    - Tabela ou gráfico de throughput por número de workers com nproc anotado.
    - "Produtor/consumidor com dois condition variables reescrito de memória, com o diff contra `pc.c` comentado."
  reviewQuestions:
    - Que invariantes a fila mantém e em que pontos do código elas ficam temporariamente quebradas?
    - Por que o limite da fila é uma forma de backpressure, e o que acontece sem ele quando os produtores são mais rápidos?
    - Qual das quatro condições de deadlock sua correção quebra?
    - Por que o throughput para tarefas de CPU para de crescer, enquanto o de tarefas de espera continua?
  practice:
    guidance: >-
      Antes do marco 1, redigite à mão (sem colar), num diretório novo, `threads-intro/t1.c` (contador
      compartilhado sem lock) e `threads-cv/pc.c` (produtor/consumidor com buffer limitado) do repositório
      de código do OSTEP, lendo junto o capítulo Condition Variables. Anote cada lock, `Cond_wait` e
      `Cond_signal` (wrappers de pthread definidos em `include/common_threads.h`, que também deve ser redigitado), e quebre de propósito: trocar `while` por `if` no wait, usar um
      único condition variable (compare com `pc_single_cv.c`), inserir `sleep()` para forçar o pior caso.
      Modifique o buffer para guardar jobs de tarefa em vez de inteiros e, dias depois, reescreva o
      produtor/consumidor de memória.
    references:
      - title: "ostep-code: threads-cv (pc.c, pc_single_cv.c)"
        author: "Remzi Arpaci-Dusseau"
        url: https://github.com/remzi-arpacidusseau/ostep-code/tree/master/threads-cv
        language: C
      - title: "ostep-code: threads-intro (t1.c)"
        author: "Remzi Arpaci-Dusseau"
        url: https://github.com/remzi-arpacidusseau/ostep-code/tree/master/threads-intro
        language: C
      - title: "Operating Systems: Three Easy Pieces — Condition Variables"
        author: "Remzi H. Arpaci-Dusseau e Andrea C. Arpaci-Dusseau"
        url: https://pages.cs.wisc.edu/~remzi/OSTEP/threads-cv.pdf
        language: C
